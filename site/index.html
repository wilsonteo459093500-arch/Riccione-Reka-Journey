<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#2F4A3C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TORA" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>TORA by Riccione Reka</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 信号太差、主程序没下载下来时不要一直白屏：12 秒后还没画出来就提示（主程序一画出来就会盖掉这段）
      setTimeout(function () {
        var r = document.getElementById('root');
        if (r && !r.firstChild) {
          r.innerHTML =
            '<div style="max-width:22rem;margin:30vh auto 0;padding:0 24px;text-align:center;font:15px/1.6 system-ui,sans-serif;color:#4a4a44">' +
            '信号太差，TORA 还没下载完。<br>请到信号好一点的地方再打开。' +
            '<br><button onclick="location.reload()" style="margin-top:16px;padding:10px 22px;border:0;border-radius:12px;background:#2F4A3C;color:#fff;font:inherit">重新打开</button></div>';
        }
      }, 12000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
