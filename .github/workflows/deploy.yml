# 测试 + 上线（说明见 DEPLOY-FLOW.md）
#
# 每推一次：只有改到的软件才跑测试、出版本。
# - main 分支 → 正式版（合并 = 上线）
# - 别的分支 → 预览版，网址贴在 PR 留言里
# 测试没过就不出版本。Vercel 项目自己的「GitHub 一推就建」已关掉，所以不相干的推送不再吃部署额度。

name: 测试 + 上线

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      app:
        description: '要重新出版本的软件：kira / visi / space / ukir / wish / all（在 main 上按 = 正式版）'
        required: true
        default: kira

permissions:
  contents: read
  pull-requests: write

env:
  VERCEL_CLI: vercel@65.9.0

jobs:
  changes:
    name: 看改到哪些软件
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.pick.outputs.apps }}
      prod: ${{ steps.pick.outputs.prod }}
      team: ${{ steps.team.outputs.team }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: team
        run: echo "team=$(node -p "require('./.github/apps.json').team")" >> "$GITHUB_OUTPUT"
      - id: pick
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PICKED_APP: ${{ github.event.inputs.app }}
        run: node .github/scripts/changed-apps.mjs

  app:
    name: ${{ matrix.app.name }}
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    concurrency:
      group: deploy-${{ matrix.app.id }}-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    env:
      VERCEL_ORG_ID: ${{ needs.changes.outputs.team }}
      VERCEL_PROJECT_ID: ${{ matrix.app.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 测试
        working-directory: ${{ matrix.app.dir }}
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)" 2>/dev/null; then
            npm ci --no-audit --no-fund
            npm test
          else
            echo "这个软件没有自动测试，跳过"
          fi

      # 浏览器测试（真的开 Chromium 走一遍）：软件的 package.json 有 test:browser 才跑。现在只有 UKIR STUDIO 有（展厅播放）
      - name: 浏览器测试
        working-directory: ${{ matrix.app.dir }}
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['test:browser'] ? 0 : 1)" 2>/dev/null; then
            npx playwright install --with-deps chromium
            npm run test:browser
          else
            echo "这个软件没有浏览器测试，跳过"
          fi

      - name: 出版本（${{ needs.changes.outputs.prod == 'true' && '正式版' || '预览' }}）
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROD: ${{ needs.changes.outputs.prod }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::还没设 VERCEL_TOKEN（GitHub 仓库 Settings → Secrets and variables → Actions）。见 DEPLOY-FLOW.md 第 1 步"
            exit 1
          fi
          # 出版本失败（例如 Vercel 一天 100 次的额度用完）要亮红灯：没有这行，后面的 tail 会把失败盖掉，PR 上只看到「undefined」
          set -o pipefail
          FLAGS="--yes --archive=tgz"
          if [ "$PROD" = "true" ]; then FLAGS="$FLAGS --prod"; fi
          # 从仓库根目录上传；Vercel 照项目设定的 Root Directory（${{ matrix.app.dir }}）去构建
          # 出不成一定要亮红灯：以前额度用完时这一步照样算成功，网址是空的（2026-11-20 踩过）
          set +e
          npx --yes "$VERCEL_CLI" deploy $FLAGS --token "$VERCEL_TOKEN" > deploy.out 2> deploy.err
          CODE=$?
          set -e
          cat deploy.err >&2
          URL=$(tail -n 1 deploy.out)
          if [ "$CODE" -ne 0 ] || ! printf '%s' "$URL" | grep -q '^https://'; then
            if grep -q 'api-deployments-free-per-day' deploy.err deploy.out; then
              echo "::error::${{ matrix.app.name }} 没出成：Vercel 今天的 100 次额度用完了。等额度回来（24 小时内），到 Actions 按「Run workflow」重出一次"
            else
              echo "::error::${{ matrix.app.name }} 没出成版本，原因看上面 Vercel 的讯息"
            fi
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### ${{ matrix.app.name }}：$URL" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p out && printf '%s\t%s\n' "${{ matrix.app.name }}" "$URL" > "out/${{ matrix.app.id }}.tsv"

      - uses: actions/upload-artifact@v4
        if: steps.deploy.outcome == 'success'
        with:
          name: url-${{ matrix.app.id }}
          path: out/${{ matrix.app.id }}.tsv
          retention-days: 3

  report:
    name: 预览网址贴到 PR
    needs: [changes, app]
    if: always() && needs.changes.outputs.prod != 'true' && needs.changes.outputs.apps != '[]' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: url-*
          merge-multiple: true
          path: out
        continue-on-error: true
      - uses: actions/github-script@v7
        env:
          APPS: ${{ needs.changes.outputs.apps }}
        with:
          script: |
            const fs = require('fs');
            const rows = (fs.existsSync('out')
              ? fs.readdirSync('out').map((f) => fs.readFileSync(`out/${f}`, 'utf8').trim().split('\t'))
              : []).filter(([n, u]) => n && /^https:\/\//.test(u || ''));
            // 应该出、却没有网址的软件：明讲「没出成」，不要漏掉或写成 undefined
            const done = new Set(rows.map(([n]) => n));
            const missing = JSON.parse(process.env.APPS || '[]').map((a) => a.name).filter((n) => !done.has(n));
            const branch = context.ref.replace('refs/heads/', '');
            const { data: prs } = await github.rest.pulls.list({
              ...context.repo, state: 'open', head: `${context.repo.owner}:${branch}`,
            });
            if (!prs.length) { core.info('这条分支没有开着的 PR，不留言'); return; }
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.sha.slice(0, 7);
            const marker = '<!-- deploy-previews -->';
            const body = [
              marker,
              `**预览版**（提交 \`${sha}\`）`,
              '',
              ...rows.map(([n, u]) => `- ${n}：${u}`),
              ...missing.map((n) => `- ${n}：**没出成**（测试没过，或 Vercel 今天的额度用完了；原因看下面的执行记录）`),
              '',
              `测试和出版本的记录：${run}`,
              '',
              '_预览网址要先登入 Vercel 才看得到。合并进 main 后会自动更新正式版。_',
            ].join('\n');
            for (const pr of prs) {
              const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: pr.number, per_page: 100 });
              const mine = comments.find((c) => c.user.type === 'Bot' && c.body.includes(marker));
              if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
              else await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body });
            }
