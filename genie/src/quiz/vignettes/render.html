<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>Vignette renderer (dev only)</title>
    <style>
      body { margin: 0; background: #1b1b1b; color: #ddd; font: 13px -apple-system, Helvetica, sans-serif; }
      #log { position: fixed; left: 8px; bottom: 8px; white-space: pre; opacity: 0.8; }
      canvas { display: block; max-width: 100vw; height: auto; }
    </style>
  </head>
  <body>
    <!--
      Dev-only tool (never part of the build: vite.config.js lists only the four app pages).
      Renders the intuition-pair vignettes of the quiz offline with the 3D studio's own procedural
      furniture and PBR materials, so the quiz bundle never loads three.js.
      Run the dev server, open /src/quiz/vignettes/render.html and call window.VG.shoot(id) —
      or use the Playwright driver described at the top of stage.js.
    -->
    <div id="log"></div>
    <script type="module" src="./stage.js"></script>
  </body>
</html>
